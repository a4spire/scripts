name: Build Windows EXE

on:
  push:
    branches:
      - claude/windows-image-batch-processing-uox70b
    paths:
      - "main.py"
      - "photo_batch_tool/**"
      - "requirements.txt"
      - "PhotoBatchTool.spec"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: U2Net-Modell für den Bundle herunterladen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest -Uri "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx" -OutFile "models/u2net.onnx"
          $hash = (Get-FileHash -Algorithm MD5 -Path "models/u2net.onnx").Hash.ToLower()
          if ($hash -ne "60024c5c889badc19c04ad937298a77b") {
            throw "u2net.onnx Prüfsumme stimmt nicht überein: $hash"
          }

      - name: EXE mit PyInstaller bauen
        run: pyinstaller PhotoBatchTool.spec

      - name: EXE als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PhotoBatchTool-windows-exe
          path: dist/PhotoBatchTool.exe
          if-no-files-found: error
